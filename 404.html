<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>404 · 页面未找到 — DSCI 6200 学习辅导手册</title>
<style>
  :root{--bg:#f7f8fa;--ink:#1f2430;--brand:#4f46e5;--muted:#6b7280}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;display:grid;place-items:center;min-height:100vh;padding:24px;text-align:center}
  h1{font-size:64px;margin:0;color:var(--brand)}
  p{color:var(--muted);margin:12px 0 24px}
  a{display:inline-block;background:var(--brand);color:#fff;text-decoration:none;padding:10px 22px;border-radius:10px;font-weight:600}
  a:hover{opacity:.9}
</style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>你访问的页面不存在或已被移动。</p>
    <a href="./">返回首页</a>
  </main>
</body>
</html>
