site_name: DSCI 6200 数据科学与机器学习
site_description: 系统化学习辅导手册（就业导向）· 覆盖第 1~4 周
site_url: https://7e2ence-source.github.io/dsci6200-study-guide/
repo_url: https://github.com/7e2ence-source/dsci6200-study-guide
repo_name: 7e2ence-source/dsci6200-study-guide
edit_uri: ""

theme:
  name: material
  language: zh
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到暗色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到亮色模式
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - toc:
      permalink: true

plugins:
  - search

nav:
  - 总览: index.md
  - 学习路线: route.md
  - 第 1 周: week1.md
  - 第 2 周: week2.md
  - 第 3 周: week3.md
  - 第 4 周: week4.md
  - 期中冲刺: exam.md
  - 面试题库: interview.md
